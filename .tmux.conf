##### Configurações gerais ##### -----------------------------------------------

# True color
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"


# Barra
set -g status-position top
set -g status-justify left
set -g status-style "bg=black,fg=white"

set -g status-left-length 20
set -g status-right-length 100

set -g status-left '#[fg=colour39]#W#[default]@#[fg=colour33]#S#[default]:(#[fg=green]#{pane_current_command}#[default])'

setw -g window-status-format ""
setw -g window-status-current-format ""

set -g status-right '#[align=left]#{repeat:100, }#[align=absolute-centre] #(LC_TIME=pt_BR.UTF-8 date "+%a, %d de %b %H:%M") #[align=right] #{wifi_ssid} #{wifi_icon}'


##### Configuração de plugins ##### --------------------------------------------

# gmoe/tmux-wifi
set -g @tmux_wifi_icon_off "󰤮 "
set -g @tmux_wifi_icon_1 "󰤯 "
set -g @tmux_wifi_icon_2 "󰤟 "
set -g @tmux_wifi_icon_3 "󰤢 "
set -g @tmux_wifi_icon_4 "󰤥 "
set -g @tmux_wifi_icon_5 "󰤨 "


##### Plugins ##### ------------------------------------------------------------

# Listagem
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'gmoe/tmux-wifi'

# Inicialização do TPM (manter no final)
run '~/.tmux/plugins/tpm/tpm'
